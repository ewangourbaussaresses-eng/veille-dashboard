[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille-dashboard"
version = "1.0.0"
description = "Agrégateur de veille : flux RSS, GitHub, Reddit → 5 actualités résumées par jour."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["veille", "rss", "digest", "dashboard", "llm", "self-hosted"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
veille-dashboard = "veille_dashboard.cli:main"

[tool.setuptools]
packages = ["veille_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
