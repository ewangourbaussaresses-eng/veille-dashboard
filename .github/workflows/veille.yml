name: veille

on:
  schedule:
    - cron: "0 7 * * *"      # tous les jours à 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer
        run: pip install -e .

      - name: Générer la veille
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          VEILLE_EMAIL_TO: ${{ secrets.VEILLE_EMAIL_TO }}
          VEILLE_WEBHOOK: ${{ secrets.VEILLE_WEBHOOK }}
        run: python -m veille_dashboard run --config config.json --state data/state.json

      - name: Publier le digest
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/digests data/state.json
          git diff --quiet --cached || git commit -m "chore(veille): digest du jour"
          git push
